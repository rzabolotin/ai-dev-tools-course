services:
  # FastAPI Backend
  backend:
    build:
      context: ./backend_fastapi
      dockerfile: Dockerfile
    container_name: code_interview_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend_fastapi:/app
    environment:
      - DATABASE_URL=mysql+aiomysql://root:secret@db:3306/code_interview
    depends_on:
      - db
    networks:
      - code_interview_network

  # Vue 3 + Vite Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: code_interview_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev"
    environment:
      - VITE_API_BASE=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000
    depends_on:
      - backend
    networks:
      - code_interview_network

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: code_interview_db
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=secret
      - MYSQL_DATABASE=code_interview
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - code_interview_network

volumes:
  db_data:

networks:
  code_interview_network:
    driver: bridge
