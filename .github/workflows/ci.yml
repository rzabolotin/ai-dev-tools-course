name: Module 2 CI

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

jobs:
  # Detect which parts of the codebase changed
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'module-2-code-interview/backend_fastapi/**'
              - 'module-2-code-interview/docker-compose.yml'
              - 'module-2-code-interview/Makefile'
            frontend:
              - 'module-2-code-interview/frontend/**'
              - 'module-2-code-interview/docker-compose.yml'
              - 'module-2-code-interview/Makefile'

  # Super-linter for annotations (visual feedback in PR)
  super-lint:
    name: Code Annotations
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.frontend == 'true'

    permissions:
      contents: read
      packages: read
      statuses: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Super-Linter
        uses: super-linter/super-linter@v7
        env:
          DEFAULT_BRANCH: master
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: false

          # Python
          VALIDATE_PYTHON_FLAKE8: ${{ needs.detect-changes.outputs.backend == 'true' }}
          VALIDATE_PYTHON_BLACK: ${{ needs.detect-changes.outputs.backend == 'true' }}
          VALIDATE_PYTHON_ISORT: ${{ needs.detect-changes.outputs.backend == 'true' }}
          VALIDATE_PYTHON_MYPY: ${{ needs.detect-changes.outputs.backend == 'true' }}

          # TypeScript/JavaScript
          VALIDATE_TYPESCRIPT_ES: ${{ needs.detect-changes.outputs.frontend == 'true' }}
          VALIDATE_JAVASCRIPT_ES: ${{ needs.detect-changes.outputs.frontend == 'true' }}

          # Configs
          PYTHON_FLAKE8_CONFIG_FILE: module-2-code-interview/backend_fastapi/.flake8
          PYTHON_BLACK_CONFIG_FILE: module-2-code-interview/backend_fastapi/pyproject.toml
          PYTHON_ISORT_CONFIG_FILE: module-2-code-interview/backend_fastapi/pyproject.toml
          PYTHON_MYPY_CONFIG_FILE: module-2-code-interview/backend_fastapi/pyproject.toml
          TYPESCRIPT_ES_CONFIG_FILE: module-2-code-interview/frontend/.eslintrc.cjs
          JAVASCRIPT_ES_CONFIG_FILE: module-2-code-interview/frontend/.eslintrc.cjs

          # Only check module-2
          FILTER_REGEX_INCLUDE: .*module-2-code-interview/.*
          FILTER_REGEX_EXCLUDE: .*/node_modules/.*|.*/__pycache__/.*|.*/dist/.*

  # Backend linting
  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'

    defaults:
      run:
        working-directory: module-2-code-interview

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          echo "DATABASE_URL=mysql+aiomysql://root:secret@db:3306/code_interview" > backend_fastapi/.env

      - name: Start Backend Service
        run: docker-compose up -d backend

      - name: Wait for Backend
        run: sleep 10

      - name: Run Backend Linters
        run: make backend_lint

      - name: Show Logs on Failure
        if: failure()
        run: docker-compose logs backend

      - name: Cleanup
        if: always()
        run: docker-compose down -v

  # Frontend linting
  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'

    defaults:
      run:
        working-directory: module-2-code-interview

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Start Frontend Service
        run: docker-compose up -d frontend

      - name: Wait for Frontend
        run: sleep 10

      - name: Run Frontend Linters
        run: make frontend_lint

      - name: Show Logs on Failure
        if: failure()
        run: docker-compose logs frontend

      - name: Cleanup
        if: always()
        run: docker-compose down -v

  # Backend tests
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'

    defaults:
      run:
        working-directory: module-2-code-interview

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          echo "DATABASE_URL=mysql+aiomysql://root:secret@db:3306/code_interview" > backend_fastapi/.env

      - name: Start Services
        run: docker-compose up -d db backend

      - name: Wait for Services
        run: |
          echo "Waiting for services to be healthy..."
          timeout 60 bash -c 'until docker-compose ps | grep -q "healthy"; do sleep 2; done'
          sleep 5

      - name: Run Backend Tests
        run: make backend_tests

      - name: Show Logs on Failure
        if: failure()
        run: docker-compose logs backend

      - name: Cleanup
        if: always()
        run: docker-compose down -v

  # Frontend tests
  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'

    defaults:
      run:
        working-directory: module-2-code-interview

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Start Frontend Service
        run: docker-compose up -d frontend

      - name: Wait for Frontend
        run: |
          echo "Waiting for frontend to be ready..."
          sleep 10

      - name: Run Frontend Tests
        run: make frontend_tests

      - name: Show Logs on Failure
        if: failure()
        run: docker-compose logs frontend

      - name: Cleanup
        if: always()
        run: docker-compose down -v

  # Summary job - required for branch protection
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [detect-changes, super-lint, lint-backend, lint-frontend, test-backend, test-frontend]
    if: always()

    steps:
      - name: Check All Jobs
        run: |
          # Check if any required job failed
          if [[ "${{ needs.super-lint.result }}" == "failure" ]]; then
            echo "❌ Code annotations (super-linter) failed"
            exit 1
          fi

          if [[ "${{ needs.lint-backend.result }}" == "failure" ]]; then
            echo "❌ Backend linting failed"
            exit 1
          fi

          if [[ "${{ needs.lint-frontend.result }}" == "failure" ]]; then
            echo "❌ Frontend linting failed"
            exit 1
          fi

          if [[ "${{ needs.test-backend.result }}" == "failure" ]]; then
            echo "❌ Backend tests failed"
            exit 1
          fi

          if [[ "${{ needs.test-frontend.result }}" == "failure" ]]; then
            echo "❌ Frontend tests failed"
            exit 1
          fi

          # Check if jobs were skipped when they should have run
          if [[ "${{ needs.detect-changes.outputs.backend }}" == "true" ]]; then
            if [[ "${{ needs.lint-backend.result }}" == "skipped" ]]; then
              echo "⚠️ Backend linting was skipped but backend changed"
              exit 1
            fi
            if [[ "${{ needs.test-backend.result }}" == "skipped" ]]; then
              echo "⚠️ Backend tests were skipped but backend changed"
              exit 1
            fi
          fi

          if [[ "${{ needs.detect-changes.outputs.frontend }}" == "true" ]]; then
            if [[ "${{ needs.lint-frontend.result }}" == "skipped" ]]; then
              echo "⚠️ Frontend linting was skipped but frontend changed"
              exit 1
            fi
            if [[ "${{ needs.test-frontend.result }}" == "skipped" ]]; then
              echo "⚠️ Frontend tests were skipped but frontend changed"
              exit 1
            fi
          fi

          echo "✅ All checks passed!"
