{% extends 'tasks/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card border-0 shadow-lg rounded-4 overflow-hidden animate-fade-in">
            <div class="card-body p-5 text-center">
                <div class="mb-4">
                    <div class="bg-danger bg-opacity-10 text-danger rounded-circle d-inline-flex align-items-center justify-content-center mb-3"
                        style="width: 80px; height: 80px;">
                        <i class="bi bi-trash3-fill fs-1"></i>
                    </div>
                    <h2 class="fw-bold text-gray-800 mb-2">Delete Task?</h2>
                    <p class="text-secondary">Are you sure you want to delete <span class="fw-bold text-dark">"{{
                            task.title }}"</span>? This action cannot be undone.</p>
                </div>

                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-3">
                        <a href="{% url 'task_list' %}"
                            class="btn btn-light px-4 py-2 fw-medium rounded-pill text-secondary hover:bg-gray-200 transition-all">
                            Cancel
                        </a>
                        <button type="submit"
                            class="btn btn-danger px-4 py-2 fw-medium rounded-pill shadow-sm hover:shadow-md transition-all d-flex align-items-center">
                            <i class="bi bi-trash me-2"></i>Delete Task
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<style>
    .animate-fade-in {
        animation: fadeIn 0.5s ease-out;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(10px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
</style>
{% endblock %}
