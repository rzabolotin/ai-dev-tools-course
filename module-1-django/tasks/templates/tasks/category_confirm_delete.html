{% extends 'tasks/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card border-0 shadow-sm rounded-4">
            <div class="card-body p-4">
                <h3 class="fw-bold text-danger mb-3">Delete Category</h3>
                <p>Are you sure you want to delete the category "<strong>{{ category.name }}</strong>"?</p>
                <p class="text-muted small">This will remove the category from all tasks, but the tasks themselves will not be deleted.</p>

                <form method="post" class="d-flex gap-2 mt-4">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Delete</button>
                    <a href="{% url 'category_list' %}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
