{% extends 'tasks/base.html' %}

{% block content %}
<h2>Delete Task</h2>

<p>Are you sure you want to delete "{{ task.title }}"?</p>

<form method="post">
    {% csrf_token %}
    <div class="form-actions">
        <button type="submit" class="btn btn-danger">Delete</button>
        <a href="{% url 'task_list' %}" class="btn btn-secondary">Cancel</a>
    </div>
</form>
{% endblock %}
