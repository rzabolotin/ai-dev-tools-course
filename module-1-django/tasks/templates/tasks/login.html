{% extends 'tasks/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-lg rounded-4 overflow-hidden animate-fade-in">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-inline-flex align-items-center justify-content-center mb-3"
                        style="width: 64px; height: 64px;">
                        <i class="bi bi-person-circle fs-2"></i>
                    </div>
                    <h2 class="fw-bold text-gray-800">Welcome Back</h2>
                    <p class="text-secondary">Please login to continue</p>
                </div>

                {% if error %}
                <div class="alert alert-danger d-flex align-items-center rounded-3 mb-4" role="alert">
                    <i class="bi bi-exclamation-circle-fill me-2"></i>
                    <div>{{ error }}</div>
                </div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}

                    <div class="mb-4">
                        <label for="username"
                            class="form-label fw-semibold text-secondary small text-uppercase tracking-wide">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-0"><i class="bi bi-person"></i></span>
                            <input type="text"
                                class="form-control form-control-lg bg-light border-0 focus:ring-2 focus:ring-indigo-500 transition-all"
                                id="username" name="username" required placeholder="Enter your username">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password"
                            class="form-label fw-semibold text-secondary small text-uppercase tracking-wide">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-0"><i class="bi bi-lock"></i></span>
                            <input type="password"
                                class="form-control form-control-lg bg-light border-0 focus:ring-2 focus:ring-indigo-500 transition-all"
                                id="password" name="password" required placeholder="Enter your password">
                        </div>
                    </div>

                    <button type="submit"
                        class="btn btn-primary w-100 py-3 fw-bold rounded-pill shadow-sm hover:shadow-md transition-all mb-3">
                        Login
                    </button>
                </form>

                <div class="text-center mt-4">
                    <p class="text-secondary mb-0">Don't have an account? <a href="{% url 'register' %}"
                            class="text-primary fw-bold text-decoration-none">Register here</a></p>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .animate-fade-in {
        animation: fadeIn 0.5s ease-out;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(10px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
</style>
{% endblock %}
