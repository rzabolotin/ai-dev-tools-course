services:
  # Laravel Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: code_interview_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=code_interview
      - DB_USERNAME=root
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - BROADCAST_DRIVER=reverb
      - REVERB_APP_ID=code-interview
      - REVERB_APP_KEY=local-key
      - REVERB_APP_SECRET=local-secret
      - REVERB_HOST=reverb
      - REVERB_PORT=8080
      - REVERB_SCHEME=http
      - REVERB_API_HOST=reverb
    depends_on:
      - db
      - redis
    networks:
      - code_interview_network

  # Laravel Reverb WebSocket Server
  reverb:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: code_interview_reverb
    entrypoint: ["/var/www/html/docker-entrypoint-reverb.sh"]
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/var/www/html
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=code_interview
      - DB_USERNAME=root
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - BROADCAST_DRIVER=reverb
      - REVERB_APP_ID=code-interview
      - REVERB_APP_KEY=local-key
      - REVERB_APP_SECRET=local-secret
      - REVERB_HOST=0.0.0.0
      - REVERB_PORT=8080
      - REVERB_SCHEME=http
      - REVERB_SERVER_HOST=0.0.0.0
    depends_on:
      - db
      - redis
      - backend
    networks:
      - code_interview_network

  # Nuxt 3 Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: code_interview_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/.nuxt
    environment:
      - NUXT_PUBLIC_API_BASE=http://localhost:8000
      - NUXT_PUBLIC_WS_URL=ws://localhost:8080
    depends_on:
      - backend
    networks:
      - code_interview_network

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: code_interview_db
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=secret
      - MYSQL_DATABASE=code_interview
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - code_interview_network

  # Redis
  redis:
    image: redis:alpine
    container_name: code_interview_redis
    ports:
      - "6379:6379"
    networks:
      - code_interview_network

volumes:
  db_data:

networks:
  code_interview_network:
    driver: bridge
