{% extends 'tasks/base.html' %}

{% block content %}
<h2>{{ action }} Task</h2>

<form method="post">
    {% csrf_token %}

    <div class="form-group">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" value="{{ task.title|default:'' }}" required>
    </div>

    <div class="form-group">
        <label for="description">Description</label>
        <textarea id="description" name="description">{{ task.description|default:'' }}</textarea>
    </div>

    <div class="form-group">
        <label for="due_date">Due Date</label>
        <input type="date" id="due_date" name="due_date" value="{{ task.due_date|date:'Y-m-d'|default:'' }}">
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{% url 'task_list' %}" class="btn btn-secondary">Cancel</a>
    </div>
</form>
{% endblock %}
